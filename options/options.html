<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Manage ToDo Folders - Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <label>
      Email account
      <select id="account"></select>
    </label>

    <label>
      Base todo folder
      <input id="folderSearch" placeholder="type to filter..." autocomplete="off" />
    </label>
    <select id="folderList" size="8"></select>
    <p id="folderCurrent"></p>

    <label>
      ToDo tag prefix
      <input id="tag" placeholder="#bk_todo_" />
    </label>
    <p class="hint">Result copied to clipboard: prefix + folder number, e.g. <code>#bk_todo_010</code>.</p>

    <h2>Remember The Milk</h2>
    <label>
      API key
      <input id="rtmApiKey" autocomplete="off" />
    </label>
    <label>
      Shared secret
      <input id="rtmSecret" type="password" autocomplete="off" />
    </label>
    <p class="hint">Get both at <code>rememberthemilk.com/services/api/keys.rtm</code>.</p>
    <div class="buttons">
      <button id="rtmConnect">Connect</button>
      <button id="rtmFinish" hidden>Finish connection</button>
      <button id="rtmDisconnect" hidden>Disconnect</button>
    </div>
    <p id="rtmStatus"></p>
    <label>
      Target list
      <select id="rtmList"></select>
    </label>
    <div class="buttons">
      <button id="rtmRefreshTags" hidden>Refresh tags</button>
    </div>
    <p id="rtmTags" class="hint"></p>
    <p class="hint">Create ToDo asks for a task name (Smart Add syntax) and adds it to this list with tag prefix + number.</p>
    <script type="module" src="options.js"></script>
  </body>
</html>
